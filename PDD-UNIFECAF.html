    <style>

        
body {

.clock {

.card {
    color: white;

    top: 50%;

fieldset {

legend {
    border: 1px solid dodgerblue;

    text-align: center;

.inputBox {

.inputUser {

}

.labelInput {

    top: 0px;
    left: 0px;

}

.inputUser:focus ~ .labelInput,
.inputUser:valid ~ .labelInput {

#data {

<body>

    <script>


function updateTime() {
    var now = new Date();
    var timeElement = document.getElementById("time");
    var dateElement = document.getElementById("date");
    var dayOfWeekElement = document.getElementById("dayOfWeek");
    var hiddenTimeElement = document.getElementById("hiddenTime");
    var hiddenDateElement = document.getElementById("hiddenDate");
    var hiddenDayOfWeekElement = document.getElementById("hiddenDayOfWeek");
          
  
    var hours = now.getHours();
    var minutes = now.getMinutes();
    var seconds = now.getSeconds();
    var day = now.getDate();
    var month = now.getMonth() + 1; // Adiciona +1 porque os meses são indexados de 0 a 11
    var year = now.getFullYear();
    var dayOfWeek = now.toLocaleDateString("pt-BR", { weekday: "long" });
  
    // Adiciona um zero na frente dos minutos e segundos se forem menores que 10
    minutes = (minutes < 10 ? "0" : "") + minutes;
    seconds = (seconds < 10 ? "0" : "") + seconds;
  
    // Atualiza os elementos HTML com o tempo, data e dia da semana atual
    timeElement.textContent = hours + ":" + minutes + ":" + seconds;
    dateElement.textContent = day + "/" + month + "/" + year;
    dayOfWeekElement.textContent = dayOfWeek;
  }
  
  // Atualiza o tempo inicialmente
  updateTime();
  
  // Atualiza o tempo a cada segundo
  setInterval(updateTime, 1000);

  
        function submitForm() {
            var form = document.getElementById("myForm");
            form.submit();
        }      
        
  function validarCPF(cpf) {
    cpf = cpf.replace(/[^\d]+/g, ''); // Remove caracteres não numéricos

    if (cpf.length !== 11 || /^(.)\1+$/.test(cpf)) {
        return false; // CPF inválido se não tiver 11 dígitos ou se todos os dígitos forem iguais
    }

    // Validação dos dígitos verificadores
    var soma = 0;
    for (var i = 0; i < 9; i++) {
        soma += parseInt(cpf.charAt(i)) * (10 - i);
    }

    var resto = soma % 11;
    var digitoVerificador1 = (resto < 2 ? 0 : 11 - resto);

    if (parseInt(cpf.charAt(9)) !== digitoVerificador1) {
        return false; // Primeiro dígito verificador inválido
    }

    soma = 0;
    for (var j = 0; j < 10; j++) {
        soma += parseInt(cpf.charAt(j)) * (11 - j);
    }

    resto = soma % 11;
    var digitoVerificador2 = (resto < 2 ? 0 : 11 - resto);

    if (parseInt(cpf.charAt(10)) !== digitoVerificador2) {
        return false; // Segundo dígito verificador inválido
    }

    return true; // CPF válido
}


var cpfInput = document.getElementById('cpf'); // ID do campo de entrada do CPF

cpfInput.addEventListener('input', function () {
    var cpf = this.value;

    if (validarCPF(cpf)) {
        this.setCustomValidity(''); // CPF válido, remove a mensagem de validação
    } else {
        this.setCustomValidity('CPF inválido'); // CPF inválido, define a mensagem de validação
    }
});


    </script>
