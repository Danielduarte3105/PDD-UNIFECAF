<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDD | UNIFECAF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a73e8;
            --secondary-color: #4285f4;
            --dark-blue: #0d47a1;
            --light-blue: #e8f0fe;
            --white: #ffffff;
            --gray: #f5f5f5;
            --dark-gray: #757575;
            --error-color: #d32f2f;
            --success-color: #388e3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a73e8, #4285f4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .clock {
            font-size: 18px;
            color: var(--white);
            text-align: center;
            margin-bottom: 15px;
        }

        .time {
            font-size: 24px;
            font-weight: 500;
        }

        .date {
            font-size: 14px;
            opacity: 0.9;
        }

        .dayOfWeek {
            font-size: 14px;
            font-weight: 300;
            text-transform: capitalize;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid var(--white);
        }

        .title {
            color: var(--white);
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            position: absolute;
            top: -10px;
            left: 10px;
            background-color: rgba(26, 115, 232, 0.9);
            color: var(--white);
            padding: 0 8px;
            font-size: 12px;
            border-radius: 10px;
            z-index: 1;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--white);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--white);
            background-color: rgba(255, 255, 255, 0.2);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .radio-group {
            margin: 15px 0;
        }

        .radio-label {
            display: flex;
            align-items: center;
            color: var(--white);
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .radio-input {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            margin-right: 10px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .radio-input:checked {
            border-color: var(--white);
            background-color: var(--primary-color);
        }

        .radio-input:checked::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 8px;
            height: 8px;
            background-color: var(--white);
            border-radius: 50%;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .submit-btn:hover {
            background: linear-gradient(to right, #0d47a1, #1a73e8);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: var(--white);
        }

        .error-message {
            color: var(--error-color);
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }
            
            .title {
                font-size: 20px;
            }
            
            .form-input {
                padding: 10px 12px;
            }
            
            .submit-btn {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="form-header">
            <img src="./uni.jpg" alt="UNIFECAF Logo" class="logo">
            <h1 class="title">Registro de Ponto</h1>
            <p class="subtitle">UNIFECAF - Programa de Desenvolvimento Docente</p>
        </div>

        <div class="clock">
            <div class="time" id="time"></div>
            <div class="date" id="date"></div>
            <div class="dayOfWeek" id="dayOfWeek"></div>
        </div>

        <form action="https://api.sheetmonkey.io/form/a7t1RJk9vYGtPRgwx3Wtmj" method="post">
            <div class="form-group">
                <input type="text" name="nome" id="nome" class="form-input" placeholder=" " required>
                <label for="nome" class="form-label">Nome completo</label>
                <div class="error-message" id="nome-error"></div>
            </div>

            <div class="form-group">
                <input type="text" name="cpf" id="cpf" class="form-input" placeholder=" " required maxlength="14">
                <label for="cpf" class="form-label">CPF</label>
                <div class="error-message" id="cpf-error"></div>
            </div>

            <div class="radio-group">
                <p style="color: white; margin-bottom: 10px; font-size: 14px;">Horário:</p>
                <label class="radio-label">
                    <input type="radio" id="07:15 às 10:00" name="horario" value="07:15 às 10:00" class="radio-input" required>
                    07:15 às 10:00
                </label>
                <label class="radio-label">
                    <input type="radio" id="19:10 às 22:00" name="horario" value="19:10 às 22:00" class="radio-input" required>
                    19:10 às 22:00
                </label>
            </div>

            <div class="form-group">
                <input type="text" name="obs" id="obs" class="form-input" placeholder=" ">
                <label for="obs" class="form-label">Observação (opcional)</label>
            </div>

            <input type="hidden" name="time" id="hiddenTime" required>
            <input type="hidden" name="date" id="hiddenDate" required>
            <input type="hidden" name="dayOfWeek" id="hiddenDayOfWeek" required>

            <button type="submit" class="submit-btn">REGISTRAR PONTO</button>
        </form>

        <div class="footer">
            <p>Sistema desenvolvido por <a href="https://github.com/Danielduarte3105" target="_blank">Daniel Duarte</a></p>
        </div>
    </div>

    <script>
        // Formatação do CPF
        document.getElementById('cpf').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            
            if (value.length > 3) {
                value = value.substring(0, 3) + '.' + value.substring(3);
            }
            if (value.length > 7) {
                value = value.substring(0, 7) + '.' + value.substring(7);
            }
            if (value.length > 11) {
                value = value.substring(0, 11) + '-' + value.substring(11, 13);
            }
            
            e.target.value = value;
            
            // Validação do CPF
            validateCPF(value);
        });

        // Validação do CPF
        function validateCPF(cpf) {
            cpf = cpf.replace(/[^\d]+/g, '');
            
            if (cpf.length !== 11 || /^(.)\1+$/.test(cpf)) {
                document.getElementById('cpf-error').textContent = 'CPF inválido';
                document.getElementById('cpf-error').style.display = 'block';
                return false;
            }
            
            let sum = 0;
            for (let i = 0; i < 9; i++) {
                sum += parseInt(cpf.charAt(i)) * (10 - i);
            }
            
            let remainder = sum % 11;
            let digit1 = remainder < 2 ? 0 : 11 - remainder;
            
            if (parseInt(cpf.charAt(9)) !== digit1) {
                document.getElementById('cpf-error').textContent = 'CPF inválido';
                document.getElementById('cpf-error').style.display = 'block';
                return false;
            }
            
            sum = 0;
            for (let i = 0; i < 10; i++) {
                sum += parseInt(cpf.charAt(i)) * (11 - i);
            }
            
            remainder = sum % 11;
            let digit2 = remainder < 2 ? 0 : 11 - remainder;
            
            if (parseInt(cpf.charAt(10)) !== digit2) {
                document.getElementById('cpf-error').textContent = 'CPF inválido';
                document.getElementById('cpf-error').style.display = 'block';
                return false;
            }
            
            document.getElementById('cpf-error').style.display = 'none';
            return true;
        }

        // Converter nome para maiúsculas
        document.getElementById('nome').addEventListener('input', function(e) {
            e.target.value = e.target.value.toUpperCase();
        });

        // Atualização do relógio
        function updateTime() {
            const now = new Date();
            const timeElement = document.getElementById('time');
            const dateElement = document.getElementById('date');
            const dayOfWeekElement = document.getElementById('dayOfWeek');
            
            // Atualiza campos ocultos
            document.getElementById('hiddenTime').value = timeElement.textContent;
            document.getElementById('hiddenDate').value = dateElement.textContent;
            document.getElementById('hiddenDayOfWeek').value = dayOfWeekElement.textContent;
            
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            
            const day = now.getDate().toString().padStart(2, '0');
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const year = now.getFullYear();
            
            const dayOfWeek = now.toLocaleDateString('pt-BR', { weekday: 'long' });
            
            timeElement.textContent = `${hours}:${minutes}:${seconds}`;
            dateElement.textContent = `${day}/${month}/${year}`;
            dayOfWeekElement.textContent = dayOfWeek.charAt(0).toUpperCase() + dayOfWeek.slice(1);
        }

        // Atualiza o tempo inicialmente e a cada segundo
        updateTime();
        setInterval(updateTime, 1000);

        // Validação do formulário
        document.querySelector('form').addEventListener('submit', function(e) {
            const nome = document.getElementById('nome').value.trim();
            const cpf = document.getElementById('cpf').value;
            
            if (!nome) {
                e.preventDefault();
                document.getElementById('nome-error').textContent = 'Por favor, insira seu nome';
                document.getElementById('nome-error').style.display = 'block';
            }
            
            if (!validateCPF(cpf)) {
                e.preventDefault();
            }
            
            if (nome && validateCPF(cpf)) {
                e.preventDefault(); // Remove esta linha em produção
                alert('Registro de ponto realizado com sucesso!');
                // this.submit(); // Descomente esta linha em produção
            }
        });

        // Melhorar experiência do formulário
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('.form-label').style.backgroundColor = 'rgba(13, 71, 161, 0.9)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.querySelector('.form-label').style.backgroundColor = 'rgba(26, 115, 232, 0.9)';
            });
        });
    </script>
</body>
</html>
